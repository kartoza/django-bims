{% extends "admin/index.html" %}

{% block content %}
{{ block.super }}

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const targetElement = document.querySelector('.g-d-c');
        if (targetElement) {
            // Create the button
            const clearCacheButton = document.createElement('a');
            clearCacheButton.href = "#";
            clearCacheButton.className = "grp-button grp-primary";
            clearCacheButton.textContent = "Clear Cache";
            clearCacheButton.style.marginLeft = "10px";

            // Add click event with confirmation
            clearCacheButton.addEventListener("click", function (event) {
                event.preventDefault();

                // Confirmation dialog
                if (confirm("Are you sure you want to clear the cache?")) {
                    // Make an AJAX request
                    fetch("{% url 'clear_cache_view' %}", {
                        method: "POST",
                        headers: {
                            "X-CSRFToken": "{{ csrf_token }}",
                            "Content-Type": "application/json"
                        },
                        credentials: 'same-origin'
                    })
                    .then(response => {
                        if (response.ok) {
                            return response.json();
                        } else {
                            throw new Error("Failed to clear cache");
                        }
                    })
                    .then(data => {
                        alert(data.message);
                        window.location.href = "/admin/";
                    })
                    .catch(error => {
                        console.error("Error clearing cache:", error);
                        alert("An unexpected error occurred. Please try again.");
                    });
                }
            });

            // Append the button to the target element
            targetElement.appendChild(clearCacheButton);

            const removeDanglingSitesBtn = document.createElement('a');
            removeDanglingSitesBtn.href = "#";
            removeDanglingSitesBtn.className = "grp-button grp-primary";
            removeDanglingSitesBtn.textContent = "Delete dangling sites";
            removeDanglingSitesBtn.style.marginLeft = "10px";
            removeDanglingSitesBtn.style.marginTop = "10px";

            removeDanglingSitesBtn.addEventListener("click", function (event) {
                event.preventDefault();

                if (confirm("Are you sure you want to delete the dangling sites?")) {
                    fetch("{% url 'delete_dangling_sites' %}", {
                        method: "POST",
                        headers: {
                            "X-CSRFToken": "{{ csrf_token }}",
                            "Content-Type": "application/json"
                        },
                        credentials: 'same-origin'
                    })
                    .then(response => {
                        if (response.ok) {
                            return response.json();
                        } else {
                            throw new Error("Failed to delete sites");
                        }
                    })
                    .then(data => {
                        alert(data.message);
                        window.location.href = "/admin/";
                    })
                    .catch(error => {
                        console.error("Error deleting sites:", error);
                        alert("An unexpected error occurred. Please try again.");
                    });
                }
            });

            targetElement.appendChild(removeDanglingSitesBtn);

            const harvestIucnBtn = document.createElement('a');
            harvestIucnBtn.href = "{% url 'harvest-iucn-status' %}";
            harvestIucnBtn.className = "grp-button grp-primary";
            harvestIucnBtn.textContent = "Harvest IUCN status";
            harvestIucnBtn.style.marginLeft = "10px";
            harvestIucnBtn.style.marginTop = "10px";

            targetElement.appendChild(harvestIucnBtn);

            const taxaQualityCheckButton = document.createElement('a');
            taxaQualityCheckButton.href = "{% url 'taxa-validation' %}";
            taxaQualityCheckButton.className = "grp-button grp-primary";
            taxaQualityCheckButton.textContent = "Taxa Data Quality";
            taxaQualityCheckButton.style.marginLeft = "10px";
            taxaQualityCheckButton.style.marginTop = "10px";

            targetElement.appendChild(taxaQualityCheckButton);

            const outsideWrapper = document.createElement('div');
            outsideWrapper.style.display = 'flex';
            outsideWrapper.style.flexDirection = 'column';   // stack vertically
            outsideWrapper.style.alignItems = 'flex-start';
            outsideWrapper.style.gap = '6px';
            outsideWrapper.style.marginTop = '10px';

            const removeOutsideBtn = document.createElement('a');
            removeOutsideBtn.href = '#';
            removeOutsideBtn.className = 'grp-button grp-primary';
            removeOutsideBtn.textContent = 'Remove sites outside boundary';
            removeOutsideBtn.style.marginLeft = '10px';
            removeOutsideBtn.style.setProperty('font-size', '8pt', 'important');

            const dryRunLabel = document.createElement('label');
            dryRunLabel.style.display = 'block';
            dryRunLabel.style.marginLeft = '10px';
            dryRunLabel.title = 'If checked, it will only report what would be deleted';

            const clearTaxaBtn = document.createElement('a');
            clearTaxaBtn.href = '#';
            clearTaxaBtn.className = 'grp-button grp-primary';
            clearTaxaBtn.textContent = 'Clear taxa not in group';
            clearTaxaBtn.style.marginLeft = '10px';
            clearTaxaBtn.style.marginTop = '15px';
            clearTaxaBtn.style.setProperty('font-size', '9pt', 'important');

            const clearGbifDeletedBtn = document.createElement('a');
            clearGbifDeletedBtn.href = '#';
            clearGbifDeletedBtn.className = 'grp-button grp-primary';
            clearGbifDeletedBtn.textContent = 'Clear GBIF deleted occurrences';
            clearGbifDeletedBtn.style.marginLeft = '10px';
            clearGbifDeletedBtn.style.marginTop = '0px';
            clearGbifDeletedBtn.style.setProperty('font-size', '9pt', 'important');
            // Hidden for now, keeping the wiring in place in case it's re-enabled.
            clearGbifDeletedBtn.style.display = 'none';

            const clearGbifDatasetBtn = document.createElement('a');
            clearGbifDatasetBtn.href = '#';
            clearGbifDatasetBtn.className = 'grp-button grp-primary';
            clearGbifDatasetBtn.textContent = 'Clear GBIF dataset';
            clearGbifDatasetBtn.style.marginLeft = '10px';
            clearGbifDatasetBtn.style.marginTop = '10px';
            clearGbifDatasetBtn.style.setProperty('font-size', '9pt', 'important');
            clearGbifDatasetBtn.title = 'Check every GBIF dataset currently in use; remove occurrences for any dataset no longer on GBIF';

            const staleDaysLabel = document.createElement('label');
            staleDaysLabel.style.display = 'block';
            staleDaysLabel.style.marginLeft = '10px';
            staleDaysLabel.title = 'Only check occurrences not modified in the last N days';
            staleDaysLabel.appendChild(document.createTextNode('GBIF stale days '));
            // Hidden alongside clearGbifDeletedBtn, which it configures.
            staleDaysLabel.style.display = 'none';

            const staleDaysInput = document.createElement('input');
            staleDaysInput.type = 'number';
            staleDaysInput.min = '0';
            staleDaysInput.value = '30';
            staleDaysInput.style.width = '60px';
            staleDaysLabel.appendChild(staleDaysInput);

            const dryRunInput = document.createElement('input');
            dryRunInput.type = 'checkbox';
            dryRunInput.id = 'outside-boundary-dry-run';
            dryRunInput.checked = true;

            const dryRunText = document.createElement('span');
            dryRunText.textContent = 'Dry run';

            dryRunLabel.appendChild(dryRunInput);
            dryRunLabel.appendChild(dryRunText);

            // Append in order: button, then label (so label is below)
            outsideWrapper.appendChild(removeOutsideBtn);
            outsideWrapper.appendChild(dryRunLabel);
            outsideWrapper.appendChild(clearTaxaBtn);
            outsideWrapper.appendChild(clearGbifDeletedBtn);
            outsideWrapper.appendChild(staleDaysLabel);
            outsideWrapper.appendChild(clearGbifDatasetBtn);
            targetElement.appendChild(outsideWrapper);

            removeOutsideBtn.addEventListener('click', function (event) {
                event.preventDefault();

                const dryRun = !!dryRunInput.checked;
                const confirmMsg = dryRun
                    ? "Run a DRY RUN? No data will be deleted."
                    : "This will permanently delete GBIF occurrences outside the boundary and any resulting empty surveys/sites. Proceed?";

                if (!confirm(confirmMsg)) return;

                fetch("{% url 'remove_outside_boundary_gbif' %}", {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": "{{ csrf_token }}",
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        dry_run: dryRun,
                        delete_empty_sites: true
                    })
                })
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error("Failed to enqueue outside-boundary cleanup");
                })
                .then(data => {
                    alert(data.message || "Cleanup task started.");
                    window.location.href = "/admin/";
                })
                .catch(error => {
                    console.error("Error starting cleanup:", error);
                    alert("An unexpected error occurred. Please try again.");
                });
            });

            clearTaxaBtn.addEventListener('click', function (event) {
                event.preventDefault();

                const dryRun = !!dryRunInput.checked;
                const confirmMsg = dryRun
                    ? "Run a DRY RUN? No data will be deleted."
                    : "This will permanently delete Taxonomy data that are NOT associated with any taxon group. Proceed?";

                if (!confirm(confirmMsg)) return;

                fetch("{% url 'clear_taxa_not_associated_in_taxon_group' %}", {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": "{{ csrf_token }}",
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        dry_run: dryRun,
                        delete_empty_sites: true
                    })
                })
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error("Failed to enqueue outside-boundary cleanup");
                })
                .then(data => {
                    alert(data.message || "Cleanup task started.");
                    window.location.href = "/admin/";
                })
                .catch(error => {
                    console.error("Error starting cleanup:", error);
                    alert("An unexpected error occurred. Please try again.");
                });
            });

            clearGbifDeletedBtn.addEventListener('click', function (event) {
                event.preventDefault();

                const dryRun = !!dryRunInput.checked;
                const staleDays = parseInt(staleDaysInput.value, 10) || 0;
                const confirmMsg = dryRun
                    ? "Run a DRY RUN? No data will be deleted; a CSV report of affected records will be emailed to superusers."
                    : "This will permanently delete GBIF-sourced occurrences that have been removed upstream in GBIF. Proceed?";

                if (!confirm(confirmMsg)) return;

                fetch("{% url 'clear_gbif_deleted_occurrences' %}", {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": "{{ csrf_token }}",
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        dry_run: dryRun,
                        stale_days: staleDays
                    })
                })
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error("Failed to enqueue GBIF deleted-occurrence cleanup");
                })
                .then(data => {
                    alert(data.message || "Cleanup task started.");
                    window.location.href = "/admin/";
                })
                .catch(error => {
                    console.error("Error starting cleanup:", error);
                    alert("An unexpected error occurred. Please try again.");
                });
            });

            clearGbifDatasetBtn.addEventListener('click', function (event) {
                event.preventDefault();

                const dryRun = !!dryRunInput.checked;
                const confirmMsg = dryRun
                    ? "Run a DRY RUN? This checks every GBIF dataset currently in use against GBIF; no data will be deleted, a report will be emailed to superusers."
                    : "This will check every GBIF dataset currently in use against GBIF and permanently delete occurrences belonging to any dataset no longer on GBIF. Proceed?";

                if (!confirm(confirmMsg)) return;

                fetch("{% url 'clear_gbif_dataset_occurrences' %}", {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": "{{ csrf_token }}",
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        dry_run: dryRun
                    })
                })
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error("Failed to enqueue GBIF dataset cleanup");
                })
                .then(data => {
                    alert(data.message || "Cleanup task started.");
                    window.location.href = "/admin/";
                })
                .catch(error => {
                    console.error("Error starting cleanup:", error);
                    alert("An unexpected error occurred. Please try again.");
                });
            });

            outsideWrapper.appendChild(removeOutsideBtn);
            outsideWrapper.appendChild(dryRunLabel);
            targetElement.appendChild(outsideWrapper);

            // -- Update Custodian from GBIF Archive --
            const custodianWrapper = document.createElement('div');
            custodianWrapper.style.border = '1px solid #ccc';
            custodianWrapper.style.borderRadius = '4px';
            custodianWrapper.style.padding = '10px';
            custodianWrapper.style.display = 'inline-block';

            const custodianTitle = document.createElement('div');
            custodianTitle.textContent = 'Update Custodian from GBIF Archive:';
            custodianTitle.style.fontWeight = 'bold';
            custodianTitle.style.marginBottom = '5px';

            const gbifFileInput = document.createElement('input');
            gbifFileInput.type = 'file';
            gbifFileInput.accept = '.zip,.txt';

            const gbifUploadBtn = document.createElement('a');
            gbifUploadBtn.href = '#';
            gbifUploadBtn.className = 'grp-button grp-primary';
            gbifUploadBtn.textContent = 'Upload & Update';
            gbifUploadBtn.style.marginLeft = '8px';

            gbifUploadBtn.addEventListener('click', function (event) {
                event.preventDefault();
                const file = gbifFileInput.files[0];
                if (!file) {
                    alert('Please select a GBIF DwC-A ZIP archive or occurrence.txt file first.');
                    return;
                }
                const formData = new FormData();
                formData.append('file', file);
                gbifUploadBtn.textContent = 'Uploading…';
                fetch("{% url 'update_custodian_from_gbif' %}", {
                    method: 'POST',
                    headers: {'X-CSRFToken': '{{ csrf_token }}'},
                    credentials: 'same-origin',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    alert(data.message || JSON.stringify(data));
                    window.location.href = '/admin/';
                })
                .catch(error => {
                    console.error('Error updating custodian:', error);
                    alert('An unexpected error occurred. Please try again.');
                    gbifUploadBtn.textContent = 'Upload & Update';
                });
            });

            custodianWrapper.appendChild(custodianTitle);
            custodianWrapper.appendChild(gbifFileInput);
            custodianWrapper.appendChild(gbifUploadBtn);
            targetElement.appendChild(custodianWrapper);

        } else {
            console.warn("Element with class 'g-d-c' not found.");
        }
    });
</script>

{% endblock %}
