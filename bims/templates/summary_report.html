{% extends 'main_base.html' %}
{% load static %}
{% block subtitle %}
    Summary report
{% endblock %}

{% block head %}
    <style>
        .summary-report {
            font-family: 'Roboto' !important;
            width: 100%;
            margin: 60px 0 60px;
            padding: 0 40px;
            padding-bottom: 50px;
        }
        .summary-report__header {
            margin-bottom: 28px;
        }
        .summary-report__header h1 {
            font-size: 34px;
            font-weight: 700;
            margin: 0;
            color: #2b2b2b;
        }
        .summary-report__header p {
            margin: 8px 0 0;
            color: #7a7a7a;
            font-size: 16px;
        }

        /* Section card */
        .report-card {
            background: #fff;
            border: 1px solid #e9edf1;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(31, 45, 61, 0.05);
            margin-bottom: 26px;
            overflow: hidden;
        }
        .report-card__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid transparent;
            transition: border-color .2s ease;
        }
        .report-card.open .report-card__header {
            border-bottom-color: #eef1f4;
        }
        .report-card__header h2 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            color: #2b2b2b;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .report-card__header h2 .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--main-accent-color);
            display: inline-block;
        }
        .report-card__chevron {
            transition: transform .25s ease;
            color: #9aa5b1;
        }
        .report-card.open .report-card__chevron {
            transform: rotate(180deg);
        }
        .report-card__body {
            padding: 22px 24px 26px;
        }

        /* Stat tiles */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 16px;
            margin-bottom: 4px;
        }
        .stat-tile {
            background: #f8fafb;
            border: 1px solid #eef1f4;
            border-radius: 12px;
            padding: 18px 18px 16px;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .stat-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(31, 45, 61, 0.08);
        }
        .stat-tile__value {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.1;
            color: var(--main-accent-color);
        }
        .stat-tile__value span[style*="red"] { color: #e14b4b !important; }
        .stat-tile__value span[style*="orange"] { color: #e79a2b !important; }
        .stat-tile__value span[style*="green"] { color: #2fae74 !important; }
        .stat-tile__label {
            margin-top: 6px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: #8a95a1;
        }
        .stat-tile__desc {
            margin-top: 8px;
            font-size: 14px;
            line-height: 1.45;
            color: #97a1ab;
        }
        .stat-tile__action {
            margin-top: 12px;
        }
        .stat-tile__action .btn {
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 8px;
        }
        .stat-tile--accent {
            background: linear-gradient(135deg, rgba(24,160,144,0.10), rgba(24,160,144,0.03));
            border-color: rgba(24,160,144,0.25);
        }

        /* Data groups */
        .data-group {
            margin-top: 26px;
        }
        .data-group__title {
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #5b6673;
            margin: 0 0 12px;
        }
        .table-wrap {
            overflow-x: auto;
            border: 1px solid #eef1f4;
            border-radius: 12px;
        }
        table.report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
            margin: 0;
        }
        table.report-table th,
        table.report-table td {
            padding: 13px 18px;
            text-align: left;
            white-space: nowrap;
        }
        table.report-table thead th {
            background: #f4f7f9;
            color: #55606c;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: .03em;
            position: sticky;
            top: 0;
            width: 20%;
        }
        table.report-table tbody tr + tr td {
            border-top: 1px solid #eef1f4;
        }
        table.report-table tbody tr:hover td {
            background: #f9fbfc;
        }
        table.report-table td.metric-name,
        table.report-table th.row-head {
            font-weight: 600;
            color: #384049;
        }
        table.report-table td.metric-value {
            font-variant-numeric: tabular-nums;
            color: #2b2b2b;
        }

        /* Loading */
        .card-loading {
            display: flex;
            justify-content: center;
            padding: 30px 0;
        }
    </style>
{% endblock %}

{% block body_content %}
    <div class="summary-report">
        <div class="summary-report__header">
            <h1>Summary Report</h1>
            <p>Overview of data quality and coverage across the platform.</p>
        </div>
        <div class="summary-container"></div>
    </div>
{% endblock %}

{% block foot %}

    <script src="{% static "js/libs/jquery/jquery-3.3.1.min.js" %}"></script>
    <script src="{% static "js/libs/bootstrap-4.0.0/js/bootstrap.min.js" %}"></script>

    <script>
        const reportsApi = [
            {
                'title': 'General Data Report',
                'url': '/api/summary-general-report/'
            }
        ];

        // Metrics that should stand out with an accent tile.
        const ACCENT_METRICS = ['total_duplicate_records', 'total_removable_duplicates'];

        // Short descriptions shown under each total in the reports.
        const METRIC_DESCRIPTIONS = {
            'total_sites': 'All location sites recorded across the platform.',
            'total_duplicated_sites': 'Sites that share the same site code with another site.',
            'total_records': 'All biological collection records in the database.',
            'total_duplicate_records': 'Validated records from the default source that share the same key fields.',
            'total_duplicate_groups': 'Distinct sets of records identified as duplicates of each other.',
            'total_removable_duplicates': 'Redundant copies that can be removed, keeping one record per group.',
            'total_modules': 'Active species modules configured on the platform.',
            'total_species': 'Distinct taxa assigned to at least one module.',
            'total_sites_without_location_context': 'Sites missing any location context data.',
            'total_sites_with_incomplete_location_context': 'Sites missing one or more location context groups.'
        };

        function toTitleCase(str) {
            return str.replace(/\w\S*/g, function (txt) {
                return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
            });
        }

        function humanize(key) {
            return toTitleCase(String(key).replace(/_/g, ' '));
        }

        function numberWithCommas(x) {
            if (typeof x === 'number' || (!isNaN(x) && x !== '' && x !== null)) {
                return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            }
            return x; // Leave HTML / non-numeric strings untouched.
        }

        const isObject = (v) => typeof v === 'object' && v !== null;

        // A stat tile for a single scalar (or pre-rendered HTML) metric.
        function renderStatTile(key, value) {
            const accent = ACCENT_METRICS.indexOf(key) !== -1 ? ' stat-tile--accent' : '';
            const tile = $(`<div class="stat-tile${accent}"></div>`);
            tile.append(`<div class="stat-tile__value">${numberWithCommas(value)}</div>`);
            tile.append(`<div class="stat-tile__label">${humanize(key)}</div>`);
            if (METRIC_DESCRIPTIONS[key]) {
                tile.append(`<div class="stat-tile__desc">${METRIC_DESCRIPTIONS[key]}</div>`);
            }
            if (key === 'total_duplicate_records') {
                tile.append(
                    `<div class="stat-tile__action">
                        <button class="btn btn-info download-duplicate-as-csv"
                                onclick="onDownloadDuplicateCSVClicked(event)">
                            <i class="fa fa-download"></i> Download CSV
                        </button>
                     </div>`
                );
            }
            return tile;
        }

        // Two-column table for a flat { key: value } object.
        function renderKeyValueTable(obj) {
            const rows = Object.keys(obj).map((k) =>
                `<tr>
                    <td class="metric-name">${humanize(k)}</td>
                    <td class="metric-value">${numberWithCommas(obj[k])}</td>
                 </tr>`
            ).join('');
            return `<div class="table-wrap">
                <table class="report-table">
                    <thead><tr><th>Item</th><th>Value</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
        }

        // Matrix table for a nested { row: { column: value } } object.
        function renderMatrixTable(obj) {
            const columns = [];
            $.each(obj, function (_, inner) {
                $.each(inner, function (col) {
                    if (columns.indexOf(col) === -1) columns.push(col);
                });
            });
            const head = `<tr><th class="row-head">Item</th>${
                columns.map((c) => `<th>${humanize(c)}</th>`).join('')
            }</tr>`;
            const body = Object.keys(obj).map((rowKey) => {
                const cells = columns.map((c) => {
                    const v = obj[rowKey][c];
                    return `<td class="metric-value">${v === undefined ? '-' : numberWithCommas(v)}</td>`;
                }).join('');
                return `<tr><td class="row-head">${humanize(rowKey)}</td>${cells}</tr>`;
            }).join('');
            return `<div class="table-wrap">
                <table class="report-table">
                    <thead>${head}</thead>
                    <tbody>${body}</tbody>
                </table>
            </div>`;
        }

        function renderGroup(key, value) {
            const group = $('<div class="data-group"></div>');
            group.append(`<div class="data-group__title">${humanize(key)}</div>`);
            const nested = Object.keys(value).some((k) => isObject(value[k]));
            group.append(nested ? renderMatrixTable(value) : renderKeyValueTable(value));
            return group;
        }

        function renderReport(body, data) {
            const scalars = {};
            const groups = {};
            $.each(data, function (key, value) {
                if (isObject(value)) {
                    groups[key] = value;
                } else {
                    scalars[key] = value;
                }
            });

            if (Object.keys(scalars).length) {
                const grid = $('<div class="stat-grid"></div>');
                $.each(scalars, function (key, value) {
                    grid.append(renderStatTile(key, value));
                });
                body.append(grid);
            }
            $.each(groups, function (key, value) {
                body.append(renderGroup(key, value));
            });
        }

        function buildCard(report) {
            const card = $('<div class="report-card open"></div>');
            const header = $(
                `<div class="report-card__header">
                    <h2><span class="dot"></span>${report.title}</h2>
                    <i class="fa fa-chevron-down report-card__chevron"></i>
                 </div>`
            );
            const body = $('<div class="report-card__body"></div>');
            card.append(header).append(body);
            $('.summary-container').append(card);

            header.on('click', function () {
                card.toggleClass('open');
                body.slideToggle(180);
            });

            const showLoading = (message) => {
                body.html(
                    `<div class="card-loading" style="flex-direction: column; gap: 12px;">
                        <img src="/static/img/small-loading.svg" width="120"
                             style="filter: brightness(104%) contrast(97%);" alt="Loading">
                        ${message ? `<div style="color:#7a7a7a; font-size:13px;">${message}</div>` : ''}
                     </div>`
                );
            };

            const load = () => {
                $.get(report.url).then(
                    (response) => {
                        if (response && response.status === 'processing') {
                            showLoading(response.message || 'Generating report, please wait...');
                            setTimeout(load, 4000);
                            return;
                        }
                        body.empty();
                        renderReport(body, response);
                    },
                    () => {
                        body.html('<div class="alert alert-danger mb-0">Failed to load this report.</div>');
                    }
                );
            };

            showLoading();
            load();
        }

        $(() => {
            reportsApi.forEach(buildCard);
        });

        function onDownloadDuplicateCSVClicked(e) {
            const alertModalBody = $('#alertModalBody');
            const downloadButton = $(e.currentTarget);
            const openModal = () => $('#alertModal').modal({
                'keyboard': false,
                'backdrop': 'static'
            });

            downloadButton.prop('disabled', true);
            $.ajax({
                url: '/api/duplicate-records/download/',
                method: 'POST',
                headers: {'X-CSRFToken': csrfmiddlewaretoken},
                success: (data) => {
                    downloadButton.prop('disabled', false);
                    if (data && data.status === 'failed') {
                        alertModalBody.html(data.message || 'No duplicate records to download.');
                    } else {
                        alertModalBody.html(
                            'Your duplicate records file is being generated. ' +
                            'You can track the progress and download the file on the ' +
                            '<a href="/download-request/">Download Requests</a> page. ' +
                            'You will also be notified by email when it is ready.'
                        );
                    }
                    openModal();
                },
                error: () => {
                    downloadButton.prop('disabled', false);
                    alertModalBody.html('Failed to start the download. Please try again.');
                    openModal();
                }
            });
        }
    </script>

{% endblock %}
